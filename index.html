<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PopDarts">
  <meta name="theme-color" content="#0d0d1a">
  <title>PopDarts Live</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
    
    :root {
      --bg: #0d0d1a;
      --bg-card: #161625;
      --bg-elevated: #1f1f35;
      --border: rgba(255,255,255,0.08);
      --gold: #f5a623;
      --green: #00d68f;
      --red: #ff4757;
      --blue: #3b82f6;
      --text: #fff;
      --text-muted: #888;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

    /* =========================================
       RESPONSIVE LOGIC (The Fix)
       ========================================= */
    
    /* Default: Mobile View (Phone, Tablet, Rotated Phone) */
    .mobile-wrapper { display: flex; flex-direction: column; height: 100%; width: 100%; }
    .desktop-wrapper { display: none; }

    /* Desktop View: Only triggers on wide screens that have a mouse (hover) capability. */
    @media (min-width: 1024px) and (hover: hover) {
      .mobile-wrapper { display: none; }
      .desktop-wrapper { display: grid; grid-template-columns: 280px 1fr 300px; height: 100vh; }
    }

    /* =========================================
       SHARED LAYERS (Game, Settings)
       ========================================= */
    .overlay-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 999;
      display: none;
      flex-direction: column;
    }
    .overlay-screen.active { display: flex; }

    /* =========================================
       UI COMPONENTS
       ========================================= */
    .header {
      padding: calc(12px + var(--safe-top)) 16px 12px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(13,13,26,0.95); border-bottom: 1px solid var(--border);
    }
    .logo { font-weight: 900; font-size: 20px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
    
    .sync-badge {
      font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 20px;
      background: var(--bg-elevated); border: 1px solid var(--border); display: flex; align-items: center; gap: 6px;
      cursor: pointer;
    }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
    .sync-dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .sync-dot.busy { background: var(--gold); animation: pulse 1s infinite; }
    .sync-dot.err { background: var(--red); }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    .content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 100px; }
    
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
    
    .btn {
      width: 100%; padding: 16px; border-radius: 16px; border: none;
      font-weight: 800; font-size: 16px; cursor: pointer; margin-bottom: 12px;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-gold { background: linear-gradient(135deg, var(--gold), #d97706); color: #000; }
    .btn-green { background: var(--green); color: #000; }
    .btn-gray { background: var(--bg-elevated); color: #fff; border: 1px solid var(--border); }
    .btn-red { background: rgba(255, 71, 87, 0.2); color: var(--red); border: 1px solid var(--red); }

    /* --- MOBILE HOME --- */
    .hero {
      text-align: center; padding: 30px 20px;
      background: linear-gradient(145deg, #1e1e38 0%, #111122 100%);
      border-radius: 24px; margin-bottom: 24px; border: 1px solid var(--border);
    }
    .hero h1 { font-size: 12px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
    .hero h2 { font-size: 28px; font-weight: 900; line-height: 1.2; }

    .live-banner {
      background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
      border: 1px solid var(--green); padding: 16px; border-radius: 16px;
      margin-bottom: 20px; cursor: pointer; animation: glow 2s infinite alternate;
    }
    @keyframes glow { from { box-shadow: 0 0 10px rgba(0,214,143,0.1); } to { box-shadow: 0 0 20px rgba(0,214,143,0.3); } }

    .nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(13,13,26,0.9); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex; padding: 10px; padding-bottom: calc(10px + var(--safe-bottom));
    }
    .nav-btn { flex: 1; background: none; border: none; color: var(--text-muted); font-size: 10px; font-weight: 700; }
    .nav-btn span { display: block; font-size: 24px; margin-bottom: 4px; }
    .nav-btn.active { color: var(--gold); }

    /* --- GAME SCREEN (Vertical Split) --- */
    .game-arena { display: flex; flex-direction: column; height: 100%; }
    .p-zone { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; transition: background 0.3s; }
    .p-zone.top { border-bottom: 4px solid rgba(0,0,0,0.5); }
    
    .p-score { font-size: 90px; font-weight: 900; line-height: 1; z-index: 2; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .p-name { font-size: 20px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; z-index: 2; }
    
    .controls { display: flex; gap: 20px; align-items: center; z-index: 2; margin-top: 10px; }
    .c-btn { width: 60px; height: 60px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.3); color: #fff; font-size: 30px; cursor: pointer; }
    .c-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.9); }

    /* Progress Fill */
    .fill-bar { position: absolute; left: 0; right: 0; bottom: 0; background: currentColor; opacity: 0.2; transition: height 0.3s ease; pointer-events: none; }
    .top .fill-bar { bottom: auto; top: 0; }

    .game-hud { position: absolute; top: var(--safe-top); left: 0; right: 0; padding: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud-btn { pointer-events: auto; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 12px; border: 1px solid rgba(255,255,255,0.2); color: #fff; cursor: pointer; }

    /* --- DESKTOP LAYOUT --- */
    .d-sidebar { background: var(--bg-card); border-right: 1px solid var(--border); overflow-y: auto; padding: 20px; }
    .d-main { background: var(--bg); display: flex; flex-direction: column; padding: 40px; align-items: center; overflow-y: auto; }
    .d-right { background: var(--bg-card); border-left: 1px solid var(--border); overflow-y: auto; padding: 20px; }
    
    .d-list-item { padding: 12px; border-bottom: 1px solid var(--border); font-size: 14px; display: flex; justify-content: space-between; cursor: pointer; }
    .d-list-item:hover { background: var(--bg-elevated); }

    /* --- DART SELECTOR --- */
    .dart-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 20px; }
    .dart-opt { height: 100px; border-radius: 16px; border: 2px solid var(--border); cursor: pointer; }
    .dart-opt.selected { border-color: var(--gold); box-shadow: 0 0 15px rgba(245,166,35,0.3); }

  </style>
</head>
<body>

  <div class="mobile-wrapper" id="mobile-view">
    <div class="header">
      <div class="logo">🎯 PopDarts</div>
      <div class="sync-badge" onclick="doSync()">
        <div class="sync-dot" id="m-sync"></div>
        <span id="m-sync-txt">Sync</span>
      </div>
    </div>

    <div class="content">
      <div id="m-live-zone"></div>
      
      <div class="hero">
        <h1 id="m-hero-tag">Welcome</h1>
        <h2 id="m-hero-txt">Loading...</h2>
        <button class="btn btn-gold" style="width:auto; margin-top:15px; padding: 10px 30px;" onclick="playNext()">Play Next Game ▶</button>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:20px;">
        <div class="card" style="text-align:center; padding:15px; margin:0;" onclick="showDartPick('Custom', 'Guest')">
          <div style="font-size:24px; margin-bottom:5px;">🎮</div>
          <div style="font-size:12px; font-weight:700;">Quick Match</div>
        </div>
        <div class="card" style="text-align:center; padding:15px; margin:0;" onclick="showSettings()">
          <div style="font-size:24px; margin-bottom:5px;">⚙️</div>
          <div style="font-size:12px; font-weight:700;">Settings</div>
        </div>
      </div>

      <div class="card">
        <div style="font-size:10px; color:var(--text-muted); text-transform:uppercase; font-weight:700; margin-bottom:10px;">Standings</div>
        <div id="m-standings"></div>
      </div>
    </div>

    <div class="nav">
      <button class="nav-btn active"><span>🏠</span>Home</button>
      <button class="nav-btn" onclick="showSettings()"><span>⚙️</span>Settings</button>
    </div>
  </div>

  <div class="desktop-wrapper">
    <div class="d-sidebar">
      <h3 style="margin-bottom:20px;">👥 Players</h3>
      <div style="display:flex; gap:5px; margin-bottom:15px;">
        <input type="text" id="d-add-name" placeholder="Name" style="flex:1; padding:8px; border-radius:8px; border:none;">
        <button class="btn-green" style="padding:0 15px; border-radius:8px; border:none;" onclick="addPlayerDesktop()">+</button>
      </div>
      <div id="d-player-list"></div>
      
      <h3 style="margin-top:30px; margin-bottom:20px;">📋 Schedule</h3>
      <button class="btn btn-gold" style="font-size:12px; padding:10px;" onclick="generateDraw()">🎲 Generate Draw</button>
      <div id="d-draw-list" style="margin-top:10px;"></div>
    </div>

    <div class="d-main">
      <div class="logo" style="font-size:32px; margin-bottom:40px;">🎯 PopDarts Central</div>
      
      <div id="d-live-zone" style="width:100%; max-width:500px;"></div>

      <div class="hero" style="width:100%; max-width:500px;">
        <h1 id="d-hero-tag">Next Up</h1>
        <h2 id="d-hero-txt">-- vs --</h2>
        <button class="btn btn-gold" style="margin-top:20px;" onclick="playNext()">Start Game on Desktop</button>
      </div>

      <div style="display:flex; gap:20px; margin-top:20px;">
        <button class="btn btn-gray" style="width:auto;" onclick="doSync()">Force Sync</button>
        <button class="btn btn-gray" style="width:auto;" onclick="window.open(SPREADSHEET_URL)">Open Sheet</button>
      </div>
    </div>

    <div class="d-right">
      <h3 style="margin-bottom:20px;">📊 Standings</h3>
      <div id="d-standings"></div>
    </div>
  </div>

  <div id="screen-darts" class="overlay-screen">
    <div class="header">
      <div class="logo">Pick Darts</div>
      <button class="hud-btn" onclick="closeOverlay()">Cancel</button>
    </div>
    <div class="content" style="text-align:center;">
      <h2 id="dart-pick-name">Player 1</h2>
      <p style="color:var(--text-muted);">Choose your color</p>
      <div class="dart-grid" id="dart-list"></div>
    </div>
  </div>

  <div id="screen-game" class="overlay-screen">
    <div class="game-hud">
      <button class="hud-btn" onclick="pauseGame()">⏸ Pause / Exit</button>
      <div class="hud-btn" style="background:var(--bg-elevated); color:var(--gold);">Target: <span id="g-target">21</span></div>
    </div>
    
    <div class="game-arena">
      <div class="p-zone top" id="zone-1">
        <div class="fill-bar" id="bar-1" style="height:0%"></div>
        <div class="p-name" id="name-1">Player 1</div>
        <div class="p-score" id="score-1">0</div>
        <div class="controls">
          <button class="c-btn" onclick="score(1, -1)">-</button>
          <button class="c-btn" style="border-color:var(--green); background:rgba(0,255,0,0.1)" onclick="score(1, 1)">+</button>
          <button class="c-btn" style="font-size:16px; font-weight:700" onclick="score(1, 2)">+2</button>
          <button class="c-btn" style="font-size:16px; font-weight:700" onclick="score(1, 3)">+3</button>
        </div>
      </div>

      <div class="p-zone bot" id="zone-2">
        <div class="fill-bar" id="bar-2" style="height:0%"></div>
        <div class="p-name" id="name-2">Player 2</div>
        <div class="p-score" id="score-2">0</div>
        <div class="controls">
          <button class="c-btn" onclick="score(2, -1)">-</button>
          <button class="c-btn" style="border-color:var(--green); background:rgba(0,255,0,0.1)" onclick="score(2, 1)">+</button>
          <button class="c-btn" style="font-size:16px; font-weight:700" onclick="score(2, 2)">+2</button>
          <button class="c-btn" style="font-size:16px; font-weight:700" onclick="score(2, 3)">+3</button>
        </div>
      </div>
    </div>
  </div>

  <div id="screen-settings" class="overlay-screen">
    <div class="header">
      <div class="logo">Settings</div>
      <button class="hud-btn" onclick="closeOverlay()">Close</button>
    </div>
    <div class="content">
      <div class="card">
        <h3>Players</h3>
        <input type="text" id="set-add-player" placeholder="Enter Name" style="width:100%; padding:10px; margin:10px 0; border-radius:8px; border:none;">
        <button class="btn btn-green" onclick="addPlayerSettings()">Add Player</button>
        <div id="set-player-list" style="margin-top:10px; opacity:0.7;"></div>
      </div>
      <div class="card">
        <h3>Game Options</h3>
        <p>Target Score</p>
        <select id="set-target" onchange="saveTarget()" style="width:100%; padding:10px; border-radius:8px;">
          <option value="15">15</option>
          <option value="21">21</option>
          <option value="31">31</option>
        </select>
        <br><br>
        <button class="btn btn-red" onclick="clearEvent()">⚠ Reset Championship</button>
      </div>
    </div>
  </div>

<script>
// ===========================================
// CONFIGURATION
// ===========================================
// NEW API URL UPDATED HERE:
const API_URL = 'https://script.google.com/macros/s/AKfycby5b5Ucri4ZvRxrFZnWLEpZsf1moXQV1X2pCZotLOriQFTi0k0i718LUlwT285FCxQTLw/exec';
const SPREADSHEET_URL = 'https://docs.google.com/spreadsheets/d/1Y6B_jUO_EWiqSKUB2Z6pYCwqI4TDZDirbQ3fgZcPphA/edit';

const DARTS = [
  {id:'grn', color:'#00d68f', name:'Green'},
  {id:'org', color:'#f5a623', name:'Orange'},
  {id:'blu', color:'#3b82f6', name:'Blue'},
  {id:'pur', color:'#a855f7', name:'Purple'},
  {id:'red', color:'#ff4757', name:'Red'}
];

// STATE
let Data = { players:[], draw:[], stats:[], target:21, live:null };
let Game = { active:false, p1:'', p2:'', s1:0, s2:0, c1:DARTS[0], c2:DARTS[1], id:null };
let liveTimer = null;

// ===========================================
// INITIALIZATION
// ===========================================
window.onload = () => {
  doSync();
  setInterval(doSync, 10000); // Background sync every 10s
};

// ===========================================
// API HANDLERS
// ===========================================
async function apiCall(action, payload=null) {
  setSyncStatus('busy');
  try {
    const opts = payload ? { method:'POST', body:JSON.stringify({action, ...payload}) } : { method:'GET' };
    const url = payload ? API_URL : `${API_URL}?action=${action}`;
    
    const res = await fetch(url, opts);
    const json = await res.json();
    setSyncStatus('on');
    return json;
  } catch(e) {
    console.error(e);
    setSyncStatus('err');
    return {success:false};
  }
}

async function doSync() {
  // 1. Get Players
  let r = await apiCall('players');
  if(r.success) Data.players = r.data.players || [];
  
  // 2. Get Draw
  r = await apiCall('draw');
  if(r.success) Data.draw = r.data.games || [];
  
  // 3. Get Stats
  r = await apiCall('stats');
  if(r.success) Data.stats = r.data.stats || [];

  // 4. Check Live Game
  r = await apiCall('liveGame');
  if(r.success && r.data.active) {
    Data.live = r.data;
    // If I am not playing but looking at dashboard, update live view
    if(!Game.active) updateLiveBanners();
  } else {
    Data.live = null;
    updateLiveBanners();
  }

  renderAll();
}

function setSyncStatus(st) {
  const el = document.getElementById('m-sync');
  el.className = 'sync-dot ' + st;
  document.getElementById('m-sync-txt').innerText = st === 'busy' ? '...' : (st === 'err' ? 'Error' : 'Sync');
}

// ===========================================
// UI RENDERING
// ===========================================
function renderAll() {
  renderHome();
  renderDesktop();
  renderSettingsList();
}

function renderHome() {
  // Next Game Logic
  const next = Data.draw.find(g => !g.winner);
  const txt = next ? `${next.player1} vs ${next.player2}` : (Data.draw.length ? 'Championship Complete' : 'No Games Scheduled');
  const tag = next ? (next.gameNum === 'GF' ? '🏆 Grand Final' : `Game ${next.gameNum}`) : 'Status';
  
  document.getElementById('m-hero-tag').innerText = tag;
  document.getElementById('m-hero-txt').innerText = txt;
  
  // Standings
  const html = (Data.stats || [])
    .sort((a,b) => b.wins - a.wins || b.pointsDiff - a.pointsDiff)
    .map((s,i) => `<div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:13px;">
      <span>${i+1}. ${s.name}</span>
      <span style="font-weight:700; color:var(--gold)">${s.wins}W</span>
    </div>`).join('');
  document.getElementById('m-standings').innerHTML = html || '<div style="text-align:center; padding:10px; font-size:12px; opacity:0.5">No Stats Yet</div>';
}

function renderDesktop() {
  // Player List
  const pl = (Data.players || []).map(p => `<div class="d-list-item"><span>${p}</span></div>`).join('');
  document.getElementById('d-player-list').innerHTML = pl;
  
  // Draw List
  const dl = (Data.draw || []).map(g => `<div class="d-list-item" style="opacity:${g.winner?0.5:1}">
    <span style="font-weight:700; color:var(--gold); width:30px;">${g.gameNum}</span>
    <span style="flex:1">${g.player1} vs ${g.player2}</span>
    <span style="font-weight:700">${g.winner ? g.score1+'-'+g.score2 : ''}</span>
  </div>`).join('');
  document.getElementById('d-draw-list').innerHTML = dl;
  
  // Desktop Main
  const next = Data.draw.find(g => !g.winner);
  document.getElementById('d-hero-tag').innerText = next ? `Up Next: Game ${next.gameNum}` : 'Event Finished';
  document.getElementById('d-hero-txt').innerText = next ? `${next.player1} vs ${next.player2}` : 'All games complete';
  
  // Right Standings
  const sl = (Data.stats || []).sort((a,b) => b.wins - a.wins).map(s => 
    `<div class="d-list-item"><span>${s.name}</span><strong>${s.wins} W</strong></div>`
  ).join('');
  document.getElementById('d-standings').innerHTML = sl;
}

function updateLiveBanners() {
  const html = Data.live ? `
    <div class="live-banner" onclick="watchLive()">
      <div style="font-size:10px; font-weight:800; color:var(--green); margin-bottom:5px;">🔴 LIVE GAME IN PROGRESS</div>
      <div style="font-size:18px; font-weight:700;">${Data.live.player1} vs ${Data.live.player2}</div>
      <div style="font-size:32px; font-weight:900; color:var(--gold);">${Data.live.score1} - ${Data.live.score2}</div>
      <div style="font-size:11px; margin-top:5px; text-decoration:underline;">Click to Watch/Score</div>
    </div>` : '';
  
  document.getElementById('m-live-zone').innerHTML = html;
  document.getElementById('d-live-zone').innerHTML = html;
}

function renderSettingsList() {
    document.getElementById('set-player-list').innerHTML = (Data.players || []).join(', ');
}

// ===========================================
// GAME LOGIC
// ===========================================
function playNext() {
  const next = Data.draw.find(g => !g.winner);
  if(!next) { alert('No games scheduled. Generate a draw first.'); return; }
  showDartPick(next.player1, next.player2, next.gameNum);
}

function showDartPick(p1, p2, id) {
  Game.p1 = p1; Game.p2 = p2; Game.id = id;
  
  // Step 1: Pick P1 color
  document.getElementById('screen-darts').classList.add('active');
  document.getElementById('dart-pick-name').innerText = p1;
  renderDartGrid(1);
}

function renderDartGrid(playerNum) {
  const grid = document.getElementById('dart-list');
  // NOTE: Added quotes around d.id to fix potential string errors
  grid.innerHTML = DARTS.map(d => `
    <div class="dart-opt" style="background:linear-gradient(135deg, ${d.color} 0%, transparent 100%)" 
         onclick="selectColor(${playerNum}, '${d.id}')">
      <div style="padding:10px; font-weight:700;">${d.name}</div>
    </div>
  `).join('');
}

function selectColor(playerNum, colorId) {
  const c = DARTS.find(x => x.id === colorId);
  if(playerNum === 1) {
    Game.c1 = c;
    // Move to P2
    document.getElementById('dart-pick-name').innerText = Game.p2;
    renderDartGrid(2);
  } else {
    Game.c2 = c;
    closeOverlay();
    startGame();
  }
}

function startGame() {
  Game.s1 = 0; Game.s2 = 0; Game.active = true;
  
  // Setup UI
  document.getElementById('screen-game').classList.add('active');
  document.getElementById('name-1').innerText = Game.p1;
  document.getElementById('name-2').innerText = Game.p2;
  document.getElementById('zone-1').style.color = Game.c1.color;
  document.getElementById('zone-2').style.color = Game.c2.color;
  updateScoreUI();

  // API Live
  apiCall('updateLiveGame', {
    active:true, gameId:Game.id, player1:Game.p1, player2:Game.p2, score1:0, score2:0, target:Data.target
  });
}

function watchLive() {
  if(!Data.live) return;
  Game.p1 = Data.live.player1;
  Game.p2 = Data.live.player2;
  Game.s1 = Data.live.score1;
  Game.s2 = Data.live.score2;
  // Defaults colors for watchers
  Game.c1 = DARTS[0]; Game.c2 = DARTS[1]; 
  Game.active = false; // Watching, not hosting
  
  document.getElementById('screen-game').classList.add('active');
  document.getElementById('name-1').innerText = Game.p1;
  document.getElementById('name-2').innerText = Game.p2;
  updateScoreUI();
}

function score(p, amt) {
  if(p === 1) Game.s1 = Math.max(0, Game.s1 + amt);
  else Game.s2 = Math.max(0, Game.s2 + amt);
  
  updateScoreUI();
  
  // Sync Live
  if(Game.active) {
    apiCall('updateLiveGame', {
      active:true, gameId:Game.id, player1:Game.p1, player2:Game.p2, score1:Game.s1, score2:Game.s2
    });
  }

  // Win Check
  const target = Data.target;
  if(Game.s1 >= target || Game.s2 >= target) {
    setTimeout(() => {
      if(confirm('Game Over! Save Result?')) {
        apiCall('submitGame', {gameId:Game.id, player1:Game.p1, player2:Game.p2, score1:Game.s1, score2:Game.s2});
        apiCall('clearLiveGame');
        closeOverlay();
        doSync();
      }
    }, 200);
  }
}

function updateScoreUI() {
  document.getElementById('score-1').innerText = Game.s1;
  document.getElementById('score-2').innerText = Game.s2;
  
  const p1 = Math.min(100, (Game.s1/Data.target)*100);
  const p2 = Math.min(100, (Game.s2/Data.target)*100);
  
  document.getElementById('bar-1').style.height = p1 + '%';
  document.getElementById('bar-2').style.height = p2 + '%';
}

function pauseGame() {
  if(confirm('Exit Game? (Progress is saved in Live view only)')) {
    closeOverlay();
    apiCall('clearLiveGame');
    Game.active = false;
  }
}

// ===========================================
// HELPERS
// ===========================================
function addPlayerDesktop() {
  const name = document.getElementById('d-add-name').value;
  if(name) { apiCall('addPlayer', {playerName:name}).then(doSync); document.getElementById('d-add-name').value=''; }
}
function addPlayerSettings() {
  const name = document.getElementById('set-add-player').value;
  if(name) { apiCall('addPlayer', {playerName:name}).then(doSync); document.getElementById('set-add-player').value=''; }
}
function generateDraw() {
  if(confirm('Generate new draw? (Clears old one)')) apiCall('generateDraw').then(doSync);
}
function clearEvent() {
  if(confirm('Reset EVERYTHING? (Cannot undo)')) apiCall('newEvent').then(doSync);
}
function saveTarget() {
  Data.target = parseInt(document.getElementById('set-target').value);
}
function showSettings() {
  document.getElementById('screen-settings').classList.add('active');
  renderSettingsList();
}
function closeOverlay() {
  document.querySelectorAll('.overlay-screen').forEach(e => e.classList.remove('active'));
}

</script>
</body>
